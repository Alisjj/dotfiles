set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on

bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

set -g base-index 1
setw -g pane-base-index 1

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g status-keys vi
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status on
set -g status-interval 5
set -g status-justify left

set -g status-style fg=colour231,bg=colour233
set -g window-status-current-format ' #[fg=colour231,bg=colour104] #I │ #W #[bg=colour233,nobold]'
set -g window-status-format ' #[fg=colour181] #I │ #W '
set -g window-status-separator ''

set -g pane-border-style fg=colour233
set -g pane-active-border-style fg=colour104

set -g message-style fg=colour231,bg=colour239

set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#[fg=colour231,bg=colour104] #S #[bg=colour233,nobold]'
set -g status-right '#[fg=colour231,bg=colour104] #(git -C #{pane_current_path} branch 2>/dev/null | sed "s/* //") #[bg=colour233] #[fg=colour181]#{pane_current_path} '

setw -g automatic-rename on
set -g allow-rename on

set -g focus-events on

bind -n C-w run-shell "tmux neww -c '#{pane_current_path}'"
